<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="makeWordTitle">Make a Word or PDF file</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand" data-i18n="brand">Career Launch Africa</div>
        <div id="lang-switch" class="lang-switch"></div>
      </header>

      <a class="back" href="./" data-i18n="backCv">Back to CV Launch</a>
      <h1 data-i18n="makeWordTitle">Make a Word or PDF file</h1>
      <p class="privacy" data-i18n="privacyPhone"></p>
      <p data-i18n="builtLocal"></p>

      <label for="cv-paste" data-i18n="pasteLabel"></label>
      <textarea
        id="cv-paste"
        data-i18n-placeholder="pastePlaceholder"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      ></textarea>
      <p id="parse-error" class="error" hidden></p>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="download-word" data-i18n="downloadWord"></button>
        <button type="button" class="btn btn-secondary" id="download-pdf" data-i18n="downloadPdf"></button>
      </div>
      <p class="version" data-i18n="wizardV"></p>
    </div>
    <script type="module" src="/src/makeWord.js"></script>
  </body>
</html>
