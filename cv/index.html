<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="tileCv">CV Launch</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand" data-i18n="brand">Career Launch Africa</div>
        <div id="lang-switch" class="lang-switch"></div>
      </header>

      <a class="back" href="../" data-i18n="backHub">Back to Career Launch Africa</a>
      <h1 data-i18n="tileCv">CV Launch</h1>
      <div class="progress-panel">
        <div class="progress-meta">
          <span class="progress-kicker" data-i18n="progressTitle">Progress</span>
          <p id="step-label" class="step-label"></p>
        </div>
        <div
          class="progress-track"
          role="progressbar"
          id="progress-track"
          data-i18n-aria="progressAria"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="20"
        >
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <section id="screen-path" class="screen">
        <p class="privacy howto" data-i18n="privacyChat"></p>
        <p class="howto note" data-i18n="pathHow"></p>
        <h2 data-i18n="pathQ"></h2>
        <div class="choices">
          <button type="button" class="choice choice-block" data-group="path" data-value="create">
            <strong data-i18n="pathCreate"></strong>
            <span data-i18n="pathCreateHint"></span>
          </button>
          <button type="button" class="choice choice-block" data-group="path" data-value="continue">
            <strong data-i18n="pathContinue"></strong>
            <span data-i18n="pathContinueHint"></span>
          </button>
          <button type="button" class="choice choice-block" data-group="path" data-value="improve">
            <strong data-i18n="pathImprove"></strong>
            <span data-i18n="pathImproveHint"></span>
          </button>
          <button type="button" class="choice choice-block" data-group="path" data-value="tailor">
            <strong data-i18n="pathTailor"></strong>
            <span data-i18n="pathTailorHint"></span>
          </button>
        </div>
        <div class="actions">
          <a class="btn btn-secondary" href="../" data-i18n="backStep"></a>
        </div>
      </section>

      <section id="screen-ats" class="screen hidden">
        <h2 data-i18n="atsTitle"></h2>
        <p data-i18n="atsBlurb"></p>
        <button type="button" class="btn btn-secondary" id="learn-why" data-i18n="learnWhy"></button>
        <p id="ats-learn" class="note hidden" data-i18n="atsLearnBody"></p>
        <div class="actions">
          <button type="button" class="btn btn-secondary" data-nav="back" data-i18n="backStep"></button>
          <button type="button" class="btn btn-primary" data-nav="next" data-i18n="next"></button>
        </div>
      </section>

      <section id="screen-finish" class="screen hidden">
        <h2 data-i18n="finishQ"></h2>
        <div class="choices">
          <button type="button" class="choice choice-block" data-group="finish" data-value="yes">
            <strong data-i18n="finishYes"></strong>
            <span data-i18n="finishYesHint"></span>
          </button>
          <button type="button" class="choice choice-block" data-group="finish" data-value="no">
            <strong data-i18n="finishNo"></strong>
            <span data-i18n="finishNoHint"></span>
          </button>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-secondary" data-nav="back" data-i18n="backStep"></button>
        </div>
      </section>

      <section id="screen-tips" class="screen hidden">
        <h2 data-i18n="tipsTitle"></h2>
        <p class="note" data-i18n="keepTab"></p>
        <p class="privacy" data-i18n="loginFirst"></p>
        <p class="privacy" data-i18n="pasteOnly"></p>
        <p id="continue-help" class="hidden howto note" data-i18n="readyContinueHelp"></p>
        <p id="return-create" class="hidden howto note" data-i18n="readyReturnCreate"></p>
        <p id="return-suggest" class="hidden howto note" data-i18n="readyReturnSuggest"></p>
        <p id="save-help" class="hidden howto note" data-i18n="readySaveHelp"></p>
        <div class="actions">
          <button type="button" class="btn btn-secondary" data-nav="back" data-i18n="backStep"></button>
          <button type="button" class="btn btn-primary" data-nav="next" data-i18n="next"></button>
        </div>
      </section>

      <section id="screen-copy" class="screen hidden">
        <h2 data-i18n="copyTitle"></h2>
        <p class="howto note" data-i18n="copyHow"></p>
        <p class="hint" data-i18n="recopyHint"></p>
        <button type="button" class="btn btn-primary" id="copy-wizard" data-i18n="copyWizard"></button>
        <p id="copy-status"></p>
        <details class="wizard-details">
          <summary data-i18n="showWizard"></summary>
          <textarea id="wizard-text" readonly rows="6"></textarea>
        </details>
        <div class="actions">
          <button type="button" class="btn btn-secondary" data-nav="back" data-i18n="backStep"></button>
          <button type="button" class="btn btn-primary" data-nav="next" data-i18n="copiedGoNext"></button>
        </div>
      </section>

      <section id="screen-open" class="screen hidden">
        <h2 data-i18n="openFirst"></h2>
        <p class="howto note" data-i18n="openHow"></p>
        <p class="note" data-i18n="keepTab"></p>
        <div id="first-link" class="actions"></div>
        <h2 data-i18n="ifBusy"></h2>
        <div id="backup-link" class="actions"></div>
        <p id="claude-wait" class="note hidden" data-i18n="claudeWait"></p>
        <p class="hint" data-i18n="deepSeekOnly"></p>
        <div id="deepseek-link" class="actions"></div>

        <div id="create-after" class="actions hidden">
          <a class="btn btn-secondary" href="./make-word.html" data-i18n="makeWordLater"></a>
          <a class="btn btn-secondary" href="./save-progress.html" data-i18n="saveProgressLink"></a>
        </div>

        <section id="second-opinion" class="card hidden">
          <h2 data-i18n="secondOpinionTitle"></h2>
          <p data-i18n="secondOpinionHelp"></p>
          <button type="button" class="btn btn-secondary" id="copy-second" data-i18n="copySecondOpinion"></button>
          <p id="second-status"></p>
        </section>

        <div class="actions">
          <button type="button" class="btn btn-secondary" data-nav="back" data-i18n="backStep"></button>
        </div>
      </section>

      <p class="version" data-i18n="wizardV"></p>
    </div>
    <script type="module" src="/src/cv.js"></script>
  </body>
</html>
