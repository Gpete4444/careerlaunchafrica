<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="saveProgressTitle">Save your progress</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand" data-i18n="brand">Career Launch Africa</div>
        <div id="lang-switch" class="lang-switch"></div>
      </header>

      <a class="back" href="./" data-i18n="backCv">Back to CV Launch</a>
      <h1 data-i18n="saveProgressTitle">Save your progress</h1>
      <p class="privacy" data-i18n="privacyPhone"></p>
      <p class="howto note" data-i18n="saveProgressHelp"></p>
      <p class="note" data-i18n="keepTab"></p>

      <label for="progress-paste" data-i18n="pasteProgressLabel"></label>
      <textarea
        id="progress-paste"
        data-i18n-placeholder="progressPlaceholder"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      ></textarea>
      <p id="parse-error" class="error" hidden></p>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="download-progress" data-i18n="downloadProgress"></button>
        <a class="btn btn-secondary" href="./?path=continue" data-i18n="pathContinue"></a>
      </div>
      <p class="version" data-i18n="wizardV"></p>
    </div>
    <script type="module" src="/src/saveProgress.js"></script>
  </body>
</html>
